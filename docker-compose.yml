services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  ws-server:
    build:
      context: .
      dockerfile: ws-server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TICK_SECONDS=2.0
      - TIME_MULTIPLIER=5
      - NETWORK_PATH=/app/data/network.json
      - SCENARIO_PATH=/app/data/scenario.json
    depends_on:
      redis:
        condition: service_healthy

  ai-engine:
    build:
      context: .
      dockerfile: ai-engine/Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
